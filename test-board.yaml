version: 1
project:
  name: "openscreen"
  test_command: "npm run test"
  repo: "nanameru/openscreen"

source_roots: [src, electron, tests]

cases:
  - id: TC-LOWDISK-01
    title: "録画先ボリュームの空き容量を取得できる"
    feature: "低容量保護"
    scenario: "保存先の空き容量確認"
    status: done
    priority: high
    type: unit
    source: [electron/ipc/handlers.ts]
    test_file: "electron/ipc/recordingStorage.test.ts"
    issues: [12]

  - id: TC-LOWDISK-02
    title: "危険水準で録画停止を一度だけ要求する"
    feature: "低容量保護"
    scenario: "容量不足前の安全停止"
    status: done
    priority: high
    type: regression
    source: [src/lib/lowDiskRecordingGuard.ts, src/hooks/useScreenRecorder.ts]
    test_file: "src/lib/lowDiskRecordingGuard.test.ts"
    issues: [12]

  - id: TC-LOWDISK-03
    title: "容量確保後の録画を同じプロジェクト末尾へ追加する"
    feature: "録画継続"
    scenario: "複数セグメントの同一プロジェクト化"
    status: done
    priority: high
    type: integration
    source: [src/components/ai-edition/recordingImport.ts]
    test_file: "src/components/ai-edition/recordingImport.test.ts"
    issues: [12]

  - id: TC-LOWDISK-04
    title: "macOSで低容量停止後に続きを録画して編集できる"
    feature: "録画継続"
    scenario: "実アプリの停止・再開"
    status: done
    priority: high
    type: manual
    source: [src/hooks/useScreenRecorder.ts, src/components/ai-edition/NewEditorShell.tsx]
    test_file: "technical-documentation/testing/manual-e2e-checklist.md"
    issues: [12]
